<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px; margin: 0; padding: 16px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #1e1e2e; color: #cdd6f4;
    }
    #drop {
      border: 2px dashed #45475a; border-radius: 8px;
      padding: 32px 16px; text-align: center; cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    #drop:hover, #drop.hover { border-color: #89b4fa; background: #313244; }
    #drop strong { display: block; font-size: 14px; margin-bottom: 4px; }
    #drop span { font-size: 11px; color: #7f849c; }
    #status { margin-top: 10px; font-size: 11px; color: #f38ba8; min-height: 14px; }
    .brand { text-align: center; margin-top: 12px; font-size: 10px; color: #585b70; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <div id="drop">
    <strong>Drop a Lottie file</strong>
    <span>.lottie or .json — or click to browse</span>
  </div>
  <div id="status"></div>
  <div class="brand">Lottie View · Tayari24</div>
  <input type="file" id="file" accept=".lottie,.json">
  <script src="popup.js"></script>
</body>
</html>
